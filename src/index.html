<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        --accent: #0ea5e9;
        --accent2: #6366f1;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --track: #1e293b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(1200px 700px at 50% -15%, #1e293b 0%, transparent 60%),
          radial-gradient(900px 500px at 85% 110%, rgba(99, 102, 241, 0.14) 0%, transparent 60%),
          linear-gradient(180deg, #0f172a 0%, #020617 100%);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .box { text-align: center; padding: 0 32px; }
      .logo {
        width: 104px;
        height: 104px;
        margin: 0 auto 30px;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(14, 165, 233, 0.28);
        animation: float 3.2s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      h1 { font-size: 22px; font-weight: 650; letter-spacing: 0.4px; }
      .sub { color: var(--muted); font-size: 14px; margin-top: 12px; letter-spacing: 0.3px; }
      .bar {
        width: 240px;
        height: 4px;
        margin: 30px auto 0;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 42%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 999px;
        animation: slide 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }
      /* 底部更新栏 */
      #updater-bar {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 999px;
        padding: 7px 16px;
        max-width: 92vw;
        white-space: nowrap;
      }
      #updater-bar .ver { opacity: 0.75; }
      #updater-bar button {
        background: transparent;
        border: 1px solid rgba(14, 165, 233, 0.45);
        color: var(--accent);
        font-size: 12px;
        padding: 2px 10px;
        border-radius: 999px;
        cursor: pointer;
      }
      #updater-bar button:hover:not(:disabled) { background: rgba(14, 165, 233, 0.14); }
      #updater-bar button:disabled { opacity: 0.45; cursor: default; }
      #updater-bar button.primary {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-color: transparent;
        color: #fff;
      }
      #update-status { overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="logo" src="logo.svg" alt="DeepSeek Harness" draggable="false" />
      <h1>DeepSeek Harness Desktop</h1>
      <p class="sub">正在启动本地服务，请稍候…</p>
      <div class="bar"><i></i></div>
    </div>

    <div id="updater-bar">
      <span class="ver" id="app-version">v0.1.0</span>
      <button id="btn-check">检查更新</button>
      <button id="btn-install" class="primary" style="display:none">立即更新</button>
      <button id="btn-dsh">检查 dsh 更新</button>
      <span id="update-status"></span>
    </div>

    <script>
      // Tauri 注入的全局 API（tauri.conf.json 开启 withGlobalTauri）。
      const tauriCore = window.__TAURI__ && window.__TAURI__.core;
      const tauriEvent = window.__TAURI__ && window.__TAURI__.event;
      const tauriApp = window.__TAURI__ && window.__TAURI__.app;

      const statusEl = document.getElementById('update-status');
      const btnCheck = document.getElementById('btn-check');
      const btnInstall = document.getElementById('btn-install');
      const btnDsh = document.getElementById('btn-dsh');

      function setStatus(html) { statusEl.innerHTML = html; }

      async function checkUpdate() {
        if (!tauriCore) { setStatus('当前环境不支持更新检查'); return; }
        btnCheck.disabled = true;
        setStatus('检查更新中…');
        try {
          const info = await tauriCore.invoke('check_app_update');
          if (info.has_update) {
            setStatus('发现新版本 v' + info.latest_version);
            btnInstall.style.display = 'inline-block';
          } else {
            setStatus('已是最新版本（v' + info.current_version + '）');
          }
        } catch (e) {
          setStatus('检查更新失败：' + e);
        } finally {
          btnCheck.disabled = false;
        }
      }

      async function installUpdate() {
        btnInstall.disabled = true;
        btnCheck.disabled = true;
        setStatus('正在下载更新…');
        try {
          if (tauriEvent) {
            await tauriEvent.listen('update-progress', (ev) => {
              const p = ev.payload || {};
              const pct = p.total ? Math.round((p.downloaded / p.total) * 100) : 0;
              setStatus('正在下载更新… ' + pct + '%');
            });
          }
          await tauriCore.invoke('install_app_update');
          // 正常不会走到这里：安装完成后应用会自动重启。
        } catch (e) {
          setStatus('更新失败：' + e);
          btnInstall.disabled = false;
          btnCheck.disabled = false;
        }
      }

      async function checkDsh() {
        if (!tauriCore) { setStatus('当前环境不支持 dsh 检查'); return; }
        btnDsh.disabled = true;
        setStatus('检查 dsh 更新中…');
        try {
          const info = await tauriCore.invoke('check_dsh_update');
          if (info.has_update) {
            setStatus('dsh 当前 v' + info.current_version + '，官方最新 v' + info.latest_version + '（更新需重新打包：just update 后 just release-*-offline）');
          } else {
            setStatus('dsh 已是最新版本（v' + info.current_version + '）');
          }
        } catch (e) {
          setStatus('检查 dsh 失败：' + e);
        } finally {
          btnDsh.disabled = false;
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        if (tauriApp) {
          tauriApp.getVersion().then((v) => {
            document.getElementById('app-version').textContent = 'v' + v;
          }).catch(() => {});
        }
        btnCheck.addEventListener('click', checkUpdate);
        btnInstall.addEventListener('click', installUpdate);
        btnDsh.addEventListener('click', checkDsh);
        // 启动时自动检查一次更新。
        checkUpdate();
      });
    </script>
  </body>
</html>
