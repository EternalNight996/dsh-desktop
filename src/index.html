<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        --accent: #0ea5e9;
        --accent2: #6366f1;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --track: #1e293b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(1200px 700px at 50% -15%, #1e293b 0%, transparent 60%),
          radial-gradient(900px 500px at 85% 110%, rgba(99, 102, 241, 0.14) 0%, transparent 60%),
          linear-gradient(180deg, #0f172a 0%, #020617 100%);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .box { text-align: center; padding: 0 32px; }
      .logo {
        width: 104px;
        height: 104px;
        margin: 0 auto 30px;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(14, 165, 233, 0.28);
        animation: float 3.2s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      h1 { font-size: 22px; font-weight: 650; letter-spacing: 0.4px; }
      .sub { color: var(--muted); font-size: 14px; margin-top: 12px; letter-spacing: 0.3px; }
      .bar {
        width: 240px;
        height: 4px;
        margin: 30px auto 0;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 42%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 999px;
        animation: slide 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="logo" src="logo.svg" alt="DeepSeek Harness" draggable="false" />
      <h1>DeepSeek Harness Desktop</h1>
      <p class="sub">正在启动本地服务，请稍候…</p>
      <div class="bar"><i></i></div>
    </div>
  </body>
</html>
