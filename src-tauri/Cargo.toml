[package]
name = "dsh-desktop"
version = "0.3.3"
description = "Self-contained desktop shell for DeepSeek Harness (dsh): bundles a Node sidecar, auto-starts dsh and loads its Web UI"
authors = ["EternalNight <eternalnightyeah2@yeah.net>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "2", features = ["json"] }
